<!-- Supabase > Authentication > Emails > "Reset password" -->
<!-- Konu (Subject): Pickle şifreni sıfırla -->
<div style="background:#090A0F;padding:32px 16px;font-family:Arial,Helvetica,sans-serif;color:#F1F5F9;">
  <div style="max-width:480px;margin:0 auto;background:#242656;border-radius:20px;padding:32px;">
    <h1 style="margin:0 0 16px;font-size:24px;">Şifreni sıfırla</h1>
    <p style="margin:0 0 24px;line-height:1.6;color:#94A3B8;">
      Pickle hesabın için şifre sıfırlama isteği aldık. Yeni şifreni belirlemek için aşağıdaki butona tıkla.
    </p>
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password"
       style="display:inline-block;background:#6366F1;color:#F1F5F9;font-weight:bold;text-decoration:none;padding:14px 28px;border-radius:999px;">
      Yeni şifre belirle
    </a>
    <p style="margin:24px 0 0;font-size:13px;line-height:1.6;color:#94A3B8;">
      Bu isteği sen yapmadıysan bu e-postayı görmezden gelebilirsin; şifren değişmez.
    </p>
  </div>
</div>
